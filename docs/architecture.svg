<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b" />
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef6f7" />
    </linearGradient>
  </defs>

  <rect width="900" height="380" fill="url(#bg)" />
  <rect x="20" y="20" width="860" height="340" rx="16" fill="#ffffff" stroke="#067a85" stroke-opacity="0.35" stroke-width="1.5" />
  <text x="44" y="52" font-size="16" font-weight="700" fill="#055a63">UiPath Maestro Case</text>
  <text x="44" y="72" font-size="12" fill="#64748b">Case lifecycle, human tasks, and audit trail across one governed instance</text>

  <!-- stage row -->
  <g font-size="11" fill="#0f172a" text-anchor="middle">
    <g>
      <rect x="44" y="96" width="120" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="104" y="118" font-weight="600">Intake</text>
      <text x="104" y="133" fill="#64748b" font-size="10">RPA robot opens case</text>
    </g>
    <g>
      <rect x="190" y="96" width="120" height="48" rx="10" fill="#e0f2fe" stroke="#7dd3fc" />
      <text x="250" y="118" font-weight="600">Evidence</text>
      <text x="250" y="133" fill="#64748b" font-size="10">Agent Builder agent</text>
    </g>
    <g>
      <rect x="336" y="96" width="120" height="48" rx="10" fill="#e0e7ff" stroke="#a5b4fc" />
      <text x="396" y="118" font-weight="600">Rule match</text>
      <text x="396" y="133" fill="#64748b" font-size="10">CrewAI (external)</text>
    </g>
    <g>
      <rect x="482" y="96" width="120" height="48" rx="10" fill="#fef3c7" stroke="#fcd34d" />
      <text x="542" y="118" font-weight="600">Submission</text>
      <text x="542" y="133" fill="#64748b" font-size="10">Portal robot</text>
    </g>
    <g>
      <rect x="628" y="96" width="110" height="48" rx="10" fill="#ede9fe" stroke="#c4b5fd" />
      <text x="683" y="118" font-weight="600">Decision</text>
      <text x="683" y="133" fill="#64748b" font-size="10">Status poll robot</text>
    </g>
    <g>
      <rect x="752" y="96" width="104" height="48" rx="10" fill="#ffe4e6" stroke="#fda4af" />
      <text x="804" y="118" font-weight="600">Appeal</text>
      <text x="804" y="133" fill="#64748b" font-size="10">Appeal agent</text>
    </g>
  </g>

  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="164" y1="120" x2="186" y2="120" />
    <line x1="310" y1="120" x2="332" y2="120" />
    <line x1="456" y1="120" x2="478" y2="120" />
    <line x1="602" y1="120" x2="624" y2="120" />
    <line x1="738" y1="120" x2="748" y2="120" />
  </g>

  <!-- human gate -->
  <rect x="190" y="190" width="412" height="70" rx="12" fill="#fff1f2" stroke="#fb7185" stroke-width="1.5" />
  <text x="396" y="218" font-size="14" font-weight="700" fill="#be123c" text-anchor="middle">Mandatory human gate</text>
  <text x="396" y="238" font-size="11" fill="#9f1239" text-anchor="middle">Clinician signs off before submission and before any appeal is sent</text>
  <line x1="396" y1="144" x2="396" y2="188" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="542" y1="144" x2="470" y2="190" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="804" y1="144" x2="600" y2="210" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- reasoning + governance -->
  <rect x="628" y="190" width="228" height="70" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.5" />
  <text x="742" y="216" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">Claude on AI Trust Layer</text>
  <text x="742" y="236" font-size="11" fill="#0891b2" text-anchor="middle">Reasoning for extraction and drafting</text>

  <rect x="44" y="190" width="120" height="70" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="104" y="216" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">RPA robots</text>
  <text x="104" y="234" font-size="10" fill="#16a34a" text-anchor="middle">Portal + polling</text>

  <rect x="44" y="296" width="812" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="450" y="323" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">Audit trail: every agent recommendation and human decision is timestamped and versioned</text>
</svg>
